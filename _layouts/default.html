{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" data-theme>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% include nav.html %}

    <main id="main" class="site-main{% if layout.narrow or page.narrow %} site-main--narrow{% endif %}">
      {{ content }}
    </main>

    {% include footer.html %}

    {% include scripts.html %}
  </body>
</html>
